<div class="min-h-screen bg-[#0e2a24] py-10 px-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-8 max-w-6xl mx-auto">
    <div class="flex items-center gap-3">
      <h1 class="text-[1.4rem] font-[500] text-[#f0f9f5]">All Reviews</h1>
      <span class="text-[0.7rem] font-[300] text-[#89ccb3]">{{ reviews().length }} review{{ reviews().length !== 1 ? 's' : '' }}</span>
    </div>
    <div class="flex items-center gap-3">
      <a
        routerLink="/"
        class="text-[0.7rem] font-[300] text-[#89ccb3] border border-[#1a4b3e] rounded-[0.3rem] px-3 h-[2rem] flex items-center justify-center hover:bg-[#1a4b3e] transition-colors"
      >← Home</a>
      <a
        routerLink="/new"
        class="bg-[#1a4b3e] text-[#f0f9f5] rounded-[0.3rem] text-[0.75rem] font-[300] px-4 h-[2rem] flex items-center justify-center hover:bg-[#163e34] transition-colors"
      >Write a Review</a>
    </div>
  </div>

  <!-- Grid -->
  @if (reviews().length > 0) {
    <div class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (review of reviews(); track review.id) {
        <app-review-card [review]="review" />
      }
    </div>
  } @else {
    <div class="mt-20 text-center">
      <p class="text-[#89ccb3] font-[400] text-[0.9rem]">No reviews yet</p>
      <p class="text-[0.7rem] font-[300] text-[#369376] mt-1 mb-6">Be the first to share your experience.</p>
      <a
        routerLink="/new"
        class="bg-[#1a4b3e] text-[#f0f9f5] rounded-[0.3rem] text-[0.75rem] font-[300] px-5 h-[2.3rem] inline-flex items-center justify-center hover:bg-[#163e34] transition-colors"
      >Write the First Review</a>
    </div>
  }

</div>
