<div class="min-h-screen bg-[#0e2a24] px-4 py-6 sm:px-6 sm:py-10">

  <!-- Header -->
  <div class="mx-auto mb-8 flex max-w-6xl flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:gap-3">
      <h1 class="text-[1.25rem] font-[500] text-[#f0f9f5] sm:text-[1.4rem]">All Reviews</h1>
      <span class="text-[0.8rem] font-[300] text-[#89ccb3]">{{ reviews().length }} review{{ reviews().length !== 1 ? 's' : '' }}</span>
    </div>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
      <a
        routerLink="/"
        class="flex h-[2.5rem] w-full items-center justify-center rounded-[0.3rem] border border-[#1a4b3e] px-3 text-[0.8rem] font-[300] text-[#89ccb3] transition-colors hover:bg-[#1a4b3e] sm:h-[2rem] sm:w-auto"
      >← Home</a>
      <a
        routerLink="/new"
        class="flex h-[2.5rem] w-full items-center justify-center rounded-[0.3rem] bg-[#1a4b3e] px-4 text-[0.8rem] font-[300] text-[#f0f9f5] transition-colors hover:bg-[#163e34] sm:h-[2rem] sm:w-auto"
      >Write a Review</a>
    </div>
  </div>

  <!-- Grid -->
  @if (reviews().length > 0) {
    <div class="mx-auto grid max-w-6xl grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
      @for (review of reviews(); track review.id) {
        <app-review-card [review]="review" />
      }
    </div>
  } @else {
    <div class="mt-16 text-center sm:mt-20">
      <p class="text-[0.95rem] font-[400] text-[#89ccb3]">No reviews yet</p>
      <p class="mb-6 mt-1 text-[0.8rem] font-[300] text-[#369376]">Be the first to share your experience.</p>
      <a
        routerLink="/new"
        class="inline-flex h-[2.75rem] w-full max-w-xs items-center justify-center rounded-[0.3rem] bg-[#1a4b3e] px-5 text-[0.8rem] font-[300] text-[#f0f9f5] transition-colors hover:bg-[#163e34] sm:h-[2.3rem]"
      >Write the First Review</a>
    </div>
  }

</div>
