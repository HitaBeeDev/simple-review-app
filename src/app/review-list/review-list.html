<div class="min-h-screen bg-slate-50 py-10 px-4">
  <div class="max-w-2xl mx-auto">

    <!-- Header row -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold text-slate-900">All Reviews</h1>
        <span class="text-sm text-slate-500">{{ reviews().length }} review{{ reviews().length !== 1 ? 's' : '' }}</span>
      </div>
      <a
        routerLink="/new"
        class="inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium border border-slate-300 hover:bg-slate-100 text-slate-700 transition-colors"
      >Write a Review</a>
    </div>

    <!-- Reviews list -->
    @if (reviews().length > 0) {
      <div class="mt-8 space-y-4">
        @for (review of reviews(); track review.id) {
          <app-review-card [review]="review" />
        }
      </div>
    } @else {

      <!-- Empty state -->
      <div class="mt-20 text-center">
        <ng-icon name="lucideStar" class="text-slate-200 mx-auto mb-4" size="48" />
        <p class="text-slate-500 font-medium">No reviews yet</p>
        <p class="text-sm text-slate-400 mt-1 mb-6">Be the first to share your experience.</p>
        <a
          routerLink="/new"
          class="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-medium bg-indigo-500 hover:bg-indigo-600 text-white transition-colors"
        >Write the First Review</a>
      </div>

    }

  </div>
</div>
