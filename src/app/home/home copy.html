<div class="h-screen overflow-hidden bg-[#0e2a24]">
  <!-- Hero -->
  <section class="pt-20 pb-12 px-4 text-center">
    <ng-icon name="lucideStar" class="text-amber-400 mx-auto mb-4" size="40" />
    <h1 class="text-4xl font-bold text-white tracking-tight">ReviewApp</h1>

    <p class="text-slate-300 text-base mt-2 mb-8">Honest reviews, beautifully organized.</p>

    <div class="flex items-center justify-center gap-3">
      <a
        routerLink="/new"
        class="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-medium bg-indigo-500 hover:bg-indigo-600 text-white transition-colors"
        >Write a Review</a
      >
      <a
        routerLink="/list"
        class="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-medium border border-slate-500 hover:bg-white/10 text-slate-200 transition-colors"
        >Browse Reviews</a
      >
    </div>
  </section>

  <!-- Sample cards -->
  <section class="max-w-3xl mx-auto px-4 pb-16">
    <p class="text-xs font-semibold uppercase tracking-wider text-slate-300 mb-4">
      Featured Reviews
    </p>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      @for (review of sampleReviews; track review.id) {
        <app-review-card [review]="review" />
      }
    </div>
  </section>
</div>
