<div class="h-screen overflow-hidden bg-[#0e2a24] flex flex-col justify-center items-center">
  <div class="bg-[#f0f9f5] rounded-[0.6rem] p-8 min-w-[50%] max-w-[80%]">
    <div class="flex flex-col justify-center items-start">
      <p class="text-[1.8rem] font-[500] text-[#163e34]">Share your experience</p>

      <p class="text-[0.7rem] font-[300] text-[#1a4b3e]">
        Tell us about your experience to help others make informed decisions.
      </p>
    </div>

    <div class="flex flex-row items-center justify-center gap-3 mt-8">
      <a
        routerLink="/new"
        class="bg-[#1a4b3e] text-[#f0f9f5] rounded-[0.3rem] text-[0.75rem] font-[300] w-full h-[2.3rem] flex items-center justify-center max-w-[15rem]"
      >Create a review</a>

      <a
        routerLink="/list"
        class="bg-[#daf1e6] text-[#1a4b3e] rounded-[0.3rem] text-[0.75rem] font-[300] w-full h-[2.3rem] flex items-center justify-center max-w-[15rem]"
      >View all reviews</a>
    </div>

    <div class="grid grid-cols-3 gap-3 mt-8">
      @for (review of sampleReviews; track review.id) {
        <app-review-card [review]="review" />
      }
    </div>
  </div>
</div>
