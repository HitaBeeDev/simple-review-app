<div class="min-h-screen bg-slate-50">

  <!-- Hero -->
  <section class="pt-20 pb-12 px-4 text-center">
    <ng-icon name="lucideStar" class="text-amber-400 mx-auto mb-4" size="40" />
    <h1 class="text-4xl font-bold text-slate-900 tracking-tight">ReviewApp</h1>
    <p class="text-slate-500 text-base mt-2 mb-8">Honest reviews, beautifully organized.</p>

    <div class="flex items-center justify-center gap-3">
      <a
        routerLink="/new"
        class="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-medium bg-indigo-500 hover:bg-indigo-600 text-white transition-colors"
      >Write a Review</a>
      <a
        routerLink="/list"
        class="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-medium border border-slate-300 hover:bg-slate-100 text-slate-700 transition-colors"
      >Browse Reviews</a>
    </div>
  </section>

  <!-- Sample cards -->
  <section class="max-w-3xl mx-auto px-4 pb-16">
    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">Featured Reviews</p>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      @for (review of sampleReviews; track review.id) {
        <app-review-card [review]="review" />
      }
    </div>
  </section>

</div>
